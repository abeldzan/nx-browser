[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/browser-ui",
    "crates/browser-core",
    "crates/browser-engine",
    "crates/browser-engine-macos",
    "crates/browser-extensions",
    "crates/browser-storage",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
gpui = { package = "gpui-unofficial", version = "=1.17.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.17.2", features = ["font-kit"] }
gpuikit = "0.9"

# Synced Metal presents so embedded WKWebViews move in the same frame as the GPUI chrome.
[patch.crates-io]
gpui-apple-gpui-unofficial = { path = "vendor/gpui-apple" }

# GPUI is far slower unoptimized; optimize dependencies in dev builds so `cargo run` stays smooth.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
