[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/browser-ui",
    "crates/browser-core",
    "crates/browser-engine",
    "crates/browser-engine-macos",
    "crates/browser-extensions",
    "crates/browser-storage",
]

[workspace.package]
version = "0.1.12"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# The terminal emulator and image decoding are far slower unoptimized; optimize dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
