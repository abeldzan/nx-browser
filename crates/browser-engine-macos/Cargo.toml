[package]
name = "browser-engine-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
block2 = "0.6"
browser-engine = { path = "../browser-engine" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "block2",
    "NSAppearance",
    "NSBitmapImageRep",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSPopover",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSSavePanel",
    "NSTrackingArea",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGPath"] }
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAShapeLayer", "CATransaction"] }
# Only for the `SecTrust` type, so WebKit can be handed a certificate the user chose to accept.
objc2-security = { version = "0.3", default-features = false, features = ["std", "objc2", "SecTrust"] }
objc2-web-kit = "0.3"
security-framework = { version = "3", default-features = false }
uuid = { workspace = true }
